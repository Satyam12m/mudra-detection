<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mudra AI — Fast Demo</title>

  <style>
    body {
      background: #0E0B0A;
      color: #F5EFE6;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }

    #demo-box {
      border: 1px solid rgba(212,168,67,0.2);
      padding: 20px;
      margin-top: 30px;
      border-radius: 8px;
      background: #1A1410;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
    }

    #loader {
      margin-top: 20px;
      font-size: 14px;
      color: #D4A843;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      color: #D4A843;
    }

    button {
      padding: 10px 20px;
      margin-top: 20px;
      background: #C4622D;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🪷 Mudra AI Live Demo</h1>

  <button onclick="startDemo()">Start Camera</button>

  <div id="demo-box">
    <video id="video" autoplay playsinline></video>
    <div id="loader">⏳ Loading AI model...</div>
    <div id="result">Waiting...</div>
  </div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

  <script>
    let model;
    let video = document.getElementById("video");
    let result = document.getElementById("result");
    let loader = document.getElementById("loader");

    // 🚀 Load model ONCE
    async function loadModel() {
      await tf.setBackend('webgl'); // GPU acceleration
      model = await tf.loadGraphModel("model/model.json"); // change path
      loader.innerText = "✅ Model Loaded";
    }

    loadModel();

    // 🎥 Start camera
    async function startDemo() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      detect();
    }

    // 🔥 Detection loop
    async function detect() {
      if (!model) {
        requestAnimationFrame(detect);
        return;
      }

      const tensor = tf.browser.fromPixels(video)
        .resizeNearestNeighbor([128, 128])
        .toFloat()
        .expandDims();

      const prediction = await model.predict(tensor);
      const data = prediction.dataSync();

      // 👉 Replace with your labels
      const labels = ["Mudra1", "Mudra2", "Mudra3"];
      let maxIndex = data.indexOf(Math.max(...data));

      result.innerText = "Detected: " + labels[maxIndex];

      requestAnimationFrame(detect);
    }
  </script>

</body>
</html>
