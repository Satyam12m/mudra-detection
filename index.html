<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mudra Detection</title>

<!-- ⚡ Preconnect for speed -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

<style>
  body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial;
    text-align: center;
  }

  h1 {
    margin: 15px;
  }

  #container {
    position: relative;
    display: inline-block;
  }

  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  #loader {
    position: absolute;
    width: 640px;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-size: 20px;
    z-index: 10;
  }

  #result {
    position: absolute;
    bottom: 10px;
    width: 100%;
    font-size: 22px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>🖐️ Mudra Detection</h1>

<div id="container">
  <div id="loader">⚡ Preparing AI...</div>

  <video id="video" autoplay playsinline width="640" height="480"></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <div id="result">Loading...</div>
</div>

<script>
let model;
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const loader = document.getElementById("loader");

// 🚀 LOAD MODEL FAST + WARMUP
async function loadModelFast() {
  await tf.setBackend('webgl');
  await tf.ready();

  model = await tf.loadLayersModel("model.json");

  // 🔥 Warmup (critical for instant prediction)
  const dummy = tf.zeros([1, 128, 128, 3]);
  model.predict(dummy);
  dummy.dispose();

  document.getElementById("result").innerText = "Model Ready ⚡";
  loader.style.display = "none";
}

// 🎥 START CAMERA
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 }
  });
  video.srcObject = stream;
}

// ⚡ FAST PREDICTION LOOP
function predictLoop() {
  requestAnimationFrame(predictLoop);

  if (!model) return;

  ctx.drawImage(video, 0, 0, 640, 480);

  const tensor = tf.browser.fromPixels(video)
    .resizeNearestNeighbor([128, 128]) // smaller = faster
    .toFloat()
    .div(255.0)
    .expandDims();

  const prediction = model.predict(tensor);
  const data = prediction.dataSync();

  const labels = ["Mudra1", "Mudra2", "Mudra3"];
  const maxIndex = data.indexOf(Math.max(...data));

  document.getElementById("result").innerText =
    "Detected: " + labels[maxIndex];

  tf.dispose([tensor, prediction]);
}

// 🚀 RUN EVERYTHING IN PARALLEL (KEY TO SPEED)
loadModelFast();
startCamera();
predictLoop();

</script>

</body>
</html>
